<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D62828">
<meta name="apple-mobile-web-app-title" content="Mandarijn">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mandarijn Oefenapp</title>
<script>
// Zoekt automatisch de nieuwste versie (mandarijn-vN.html) in de repository en opent die.
(async function(){
  const BASE = 'mandarijn', REPO = 'rudy104e/MANDARIN', DEF = 'mandarijn-v5.html', KEY = 'latest-' + BASE;
  const go = n => location.replace(n + location.search + location.hash);
  let last = null; try{ last = localStorage.getItem(KEY); }catch(e){}
  try{
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 3000);
    const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/', {signal: ctl.signal, cache: 'no-store'});
    if (r.ok){
      const re = new RegExp('^' + BASE + '-v(\\d+)\\.html$');
      const vs = (await r.json()).map(f => { const m = f.name.match(re); return m ? [+m[1], f.name] : null; }).filter(Boolean).sort((a, b) => b[0] - a[0]);
      for (const [, n] of vs){
        try{ const h = await fetch(n, {method: 'HEAD', cache: 'no-store'}); if (h.ok){ try{ localStorage.setItem(KEY, n); }catch(e){} return go(n); } }catch(e){}
      }
    }
  }catch(e){}
  go(last || DEF);
})();
</script>
</head>
<body style="font-family:system-ui;padding:24px;color:#888">Mandarijn Oefenapp wordt geopend…</body>
</html>
